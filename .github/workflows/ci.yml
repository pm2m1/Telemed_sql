name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: telemed
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d telemed" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d telemed; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become healthy in time" >&2
          exit 1

      - name: Run init scripts
        env:
          PGPASSWORD: secret
        run: |
          set -euo pipefail
          for f in db/init/*.sql; do
            echo "Running $f"
            psql \
              -v ON_ERROR_STOP=1 \
              postgresql://postgres@localhost:5432/telemed \
              -f "$f"
          done

      - name: Run database tests
        env:
          PGPASSWORD: secret
        run: |
          set -euo pipefail
          for f in db/tests/*.sql; do
            echo "Running test $f"
            psql \
              -v ON_ERROR_STOP=1 \
              postgresql://postgres@localhost:5432/telemed \
              -f "$f"
          done

