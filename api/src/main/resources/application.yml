server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: telemed-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/telemed}
    username: ${DB_USER:telemed_api}
    password: ${DB_PASSWORD:change-me-local-only}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 5000
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
